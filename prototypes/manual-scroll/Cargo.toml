[package]
name = "arcshot-scroll-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
image = { version = "0.25", default-features = false }
screencapturekit = { version = "11.1", features = ["macos_14_0"] }
objc = "0.2"
cocoa = "0.26"
raw-window-handle = "0.6"
png = "0.18"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# objc 0.2 macros still emit this historical check at the call site.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.dev]
debug = 0
