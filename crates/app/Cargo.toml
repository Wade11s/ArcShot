[package]
name = "arcshot-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The product binary is the default for `cargo run`; the fixture is an
# E2E-only target that the harness launches explicitly.
default-run = "arcshot"

[[bin]]
name = "arcshot"
path = "src/main.rs"

[[bin]]
name = "arcshot-scroll-fixture"
path = "src/bin/scroll-fixture.rs"

[dependencies]
arcshot-core.workspace = true
arcshot-image.workspace = true
arcshot-macos.workspace = true
anyhow.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
image = { version = "0.25", default-features = false }
log = "0.4"
raw-window-handle = "0.6"

[lints]
workspace = true
